<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raúl Ricardo — Software Developer</title>
    <meta name="description" content="Personal landing page of Raúl Ricardo, Software Developer. Building performant web applications, design systems, and thoughtful developer tools.">

    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Main Central Floating Card -->
    <main class="card" role="main">

        <!-- Top Bar / Status Line -->
        <header class="card-header">
            <div class="status-badge">
                <span class="status-indicator" aria-hidden="true">
                    <span class="status-pulse"></span>
                    <span class="status-dot"></span>
                </span>
                <span data-i18n="status.available">Available for projects</span>
            </div>
            <div class="header-meta">
                <span class="version-tag" data-i18n="status.version">v0.1.0</span>
                <button id="langToggle" class="lang-toggle" type="button" aria-label="Cambiar idioma">ES</button>
            </div>
        </header>

        <!-- Developer Bio -->
        <section class="card-body">
            <h1 class="profile-name" data-i18n="profile.name">Raúl Ricardo</h1>
            <p class="profile-title" data-i18n="profile.title">Frontend Software Developer</p>
            <p class="profile-bio" data-i18n="profile.bio">
                Building performant web applications, design systems, and thoughtful developer tools.
            </p>
        </section>

        <!-- Action Buttons -->
        <nav class="card-actions" aria-label="Social and contact links">
            <a href="https://github.com/raulxricardo/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                <span class="btn-content">
                    <!-- GitHub SVG -->
                    <svg class="btn-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                    </svg>
                    <span data-i18n="buttons.github">GitHub</span>
                </span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </a>

            <a href="https://www.linkedin.com/in/raulxricardo" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                <span class="btn-content">
                    <!-- LinkedIn SVG -->
                    <svg class="btn-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.239-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                    </svg>
                    <span data-i18n="buttons.linkedin">LinkedIn</span>
                </span>
                <span class="btn-arrow" aria-hidden="true">↗</span>
            </a>

            <button id="copyBtn" type="button" class="btn btn-primary" aria-label="Copy email address to clipboard">
                <span class="btn-content">
                    <!-- Mail SVG -->
                    <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span data-i18n="buttons.contact">Get in Touch</span>
                </span>
                <span id="copy-label" class="copy-label" data-i18n="buttons.copyEmail" aria-live="polite">Copy Email</span>
            </button>
        </nav>

        <!-- Minimal Footer -->
        <footer class="card-footer" data-i18n="footer.text">
            More updates coming soon
        </footer>

    </main>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>

</html>
